<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锁序解剖室</title>
<style>
:root{
  --bg:#0f1420; --panel:#171e2e; --panel2:#1e2740; --line:#2b3654;
  --text:#e6ecf8; --muted:#8a98b8; --accent:#5aa9ff; --warn:#ffb454;
  --bad:#ff6b6b; --ok:#46d39a; --lock:#c792ea; --thread:#7fd1ff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:13px}
header{padding:12px 18px;background:linear-gradient(90deg,#142038,#0f1420);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;letter-spacing:2px}
header h1 .logo{color:var(--accent)}
.wrap{display:grid;grid-template-columns:260px 1fr 360px;gap:10px;padding:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}
.panel h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;justify-content:space-between;align-items:center}
select,button,input{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:5px;padding:5px 8px;font-size:12px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:#234; border-color:var(--accent)}
.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line)}
.tag.high{color:var(--ok);border-color:var(--ok)}
.tag.medium{color:var(--warn);border-color:var(--warn)}
.tag.low{color:var(--bad);border-color:var(--bad)}
.tag.cycle{color:#fff;background:var(--bad);border-color:var(--bad)}
.tag.lock{color:var(--lock);border-color:var(--lock)}
.tag.thread{color:var(--thread);border-color:var(--thread)}
#timeline{position:relative;height:90px;background:var(--panel2);border-radius:6px;overflow:hidden}
.lane{position:relative;height:24px;border-bottom:1px dashed var(--line)}
.lane .label{position:absolute;left:4px;top:4px;font-size:10px;color:var(--muted);z-index:2}
.bar{position:absolute;height:8px;border-radius:3px;top:11px}
.bar.hold{background:var(--accent);opacity:.75}
.bar.wait{background:var(--warn)}
.bar.cond{background:var(--lock)}
.bar.cancel{background:var(--bad);opacity:.6}
.evdot{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;top:6px;cursor:pointer}
#cursor{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:5}
svg{width:100%;height:auto;display:block}
.edge-label{font-size:9px;fill:var(--muted)}
.list-item{padding:6px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--panel2);cursor:pointer}
.list-item:hover{border-color:var(--accent)}
.list-item.active{border-color:var(--bad);background:#241a2a}
pre{background:#0b1020;border:1px solid var(--line);border-radius:5px;padding:6px;font-size:10px;
  max-height:140px;overflow:auto;white-space:pre-wrap;margin:4px 0}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs button.active{background:var(--accent);color:#04101f;border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:11px}
td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
th{color:var(--muted);font-weight:normal}
.mono{font-family:ui-monospace,Menlo,monospace}
#toast{position:fixed;bottom:14px;right:14px;background:#234;border:1px solid var(--accent);
  padding:8px 12px;border-radius:6px;display:none;z-index:99}
.scrollarea{max-height:230px;overflow:auto}
.cmp td.good{color:var(--ok)} .cmp td.bad{color:var(--bad)}
</style>
</head>
<body>
<header>
  <h1><span class="logo">🔒</span> 锁序解剖室</h1>
  <select id="runSel"></select>
  <select id="sampleSel"></select>
  <button id="loadSample">载入样例到新运行</button>
  <button id="newRun">新建空白运行</button>
  <span class="muted" id="runMeta"></span>
  <span style="flex:1"></span>
  <span>分支：</span><select id="branchSel"></select>
  <button id="branchBtn">用当前校正建分支</button>
</header>

<div class="wrap">
  <!-- 左列 -->
  <div>
    <div class="panel">
      <h2>候选重建 <span id="confTag"></span></h2>
      <div class="row">
        <span class="muted">候选图</span>
        <select id="candSel"></select>
      </div>
      <div id="candInfo" class="muted"></div>
      <div id="anomalyList" class="scrollarea" style="margin-top:6px"></div>
    </div>
    <div class="panel" style="margin-top:10px">
      <h2>追加事件（流式）</h2>
      <div class="row">
        <select id="evType">
          <option>thread_start</option><option>thread_end</option>
          <option value="acquire_req">acquire_req</option>
          <option value="acquired">acquired</option>
          <option value="released">released</option>
          <option value="cond_wait">cond_wait</option>
          <option value="cond_notify">cond_notify</option>
          <option value="cond_acquired">cond_acquired</option>
          <option value="cancelled">cancelled</option>
        </select>
      </div>
      <div class="row"><input id="evThread" placeholder="线程" style="width:80px">
        <input id="evLock" placeholder="锁" style="width:80px">
        <input id="evCond" placeholder="cond" style="width:70px"></div>
      <div class="row"><input id="evTs" placeholder="ts" type="number" step="0.1" style="width:80px">
        <select id="evMode"><option value="write">X</option><option value="read">S</option>
          <option value="upgrade">U</option></select>
        <input id="evGen" placeholder="代次" value="g0" style="width:60px"></div>
      <div class="row"><input id="evStack" placeholder="栈帧（逗号分隔）" style="width:100%"></div>
      <button id="appendEv" class="primary">追加并重算</button>
      <div id="recomputeInfo" class="muted" style="margin-top:5px"></div>
    </div>
    <div class="panel" style="margin-top:10px">
      <h2>校正 / 锁类型声明</h2>
      <div class="row">
        <input id="fixEvent" placeholder="事件 id" style="width:70px">
        <select id="fixAction"><option value="drop">删除</option>
          <option value="override">改字段</option></select>
      </div>
      <div class="row"><input id="fixPatch" placeholder='改字段 JSON，如 {"type":"released"}' style="width:100%"></div>
      <button id="applyFix">形成校正分支</button>
      <h2 style="margin-top:10px">锁类型声明</h2>
      <div class="row"><input id="ltGen" placeholder="代次" value="g0" style="width:60px">
        <input id="ltLock" placeholder="锁" style="width:80px">
        <select id="ltType"><option value="mutex">mutex</option>
          <option value="rwlock">rwlock</option></select></div>
      <button id="ltBtn">声明并应用到当前分支</button>
    </div>
  </div>

  <!-- 中列 -->
  <div>
    <div class="panel">
      <h2>时间滑块 · 线程泳道
        <span><input id="timeSlider" type="range" min="0" max="0" value="0" style="width:220px">
        <span id="sliderVal" class="mono"></span></span>
      </h2>
      <div id="timeline"></div>
      <div class="muted" id="laneHint" style="margin-top:4px">
        蓝=持有 黄=等待锁 紫=condition 等待 红=取消/退出；点白点定位事件。
      </div>
    </div>
    <div class="panel" style="margin-top:10px">
      <div class="tabs">
        <button data-tab="wait" class="active">等待图</button>
        <button data-tab="hold">持有图</button>
        <button data-tab="events">事件序列</button>
      </div>
      <div id="graphArea"><svg id="graphSvg" viewBox="0 0 800 360"></svg></div>
      <div id="eventTable" style="display:none" class="scrollarea"></div>
    </div>
  </div>

  <!-- 右列 -->
  <div>
    <div class="panel">
      <h2>环路证据 <span id="cycleCount"></span></h2>
      <div id="cycleList"></div>
    </div>
    <div class="panel" style="margin-top:10px">
      <h2>边溯源</h2>
      <div id="edgeInfo" class="muted">点击图中的边查看产生它的事件与栈。</div>
    </div>
    <div class="panel" style="margin-top:10px">
      <h2>分析工具</h2>
      <div class="row"><button id="reduceBtn" class="primary">缩减为最小复现片段</button></div>
      <div id="reduceOut"></div>
      <h2 style="margin-top:10px">分支比较</h2>
      <div class="row"><select id="cmpA"></select><select id="cmpB"></select></div>
      <button id="cmpBtn">比较两个重建</button>
      <div id="cmpOut" class="cmp"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
